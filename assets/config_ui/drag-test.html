<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pane 拖拽功能测试</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
      color: #333;
    }

    .status {
      padding: 10px;
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
      margin-top: 15px;
      border-radius: 4px;
    }

    .layout-container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      min-height: 500px;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 400px;
    }

    .pane {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #fff3e0;
      border: 2px solid #ff9800;
      border-radius: 8px;
      padding: 20px;
      cursor: move;
      user-select: none;
      transition: all 0.15s ease;
    }

    .pane:hover {
      background: #ffe0b2;
      transform: scale(1.02);
    }

    .pane.dragging {
      opacity: 0.4;
      cursor: grabbing;
    }

    .pane.drag-over {
      border-color: #2196f3;
      box-shadow: inset 0 0 0 2px #2196f3;
      background: #e3f2fd;
    }

    .pane-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .pane-meta {
      font-size: 12px;
      color: #666;
    }

    .drop-indicator {
      position: absolute;
      background: #2196f3;
      opacity: 0.7;
      z-index: 100;
      pointer-events: none;
      box-shadow: 0 0 8px rgba(33, 150, 243, 0.5);
    }

    .drop-indicator.vertical {
      height: 4px;
      width: 100%;
      left: 0;
      border-radius: 2px;
    }

    .drop-indicator.horizontal {
      width: 4px;
      height: 100%;
      top: 0;
      border-radius: 2px;
    }

    .drop-indicator.top { top: -2px; }
    .drop-indicator.bottom { bottom: -2px; }
    .drop-indicator.left { left: -2px; }
    .drop-indicator.right { right: -2px; }

    .instructions {
      background: #fff9c4;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid #ffc107;
    }

    .instructions h3 {
      margin-bottom: 10px;
    }

    .instructions ul {
      margin-left: 20px;
    }

    .instructions li {
      margin: 5px 0;
    }

    .relative {
      position: relative;
    }

    .btn {
      padding: 8px 16px;
      background: #2196f3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }

    .btn:hover {
      background: #1976d2;
    }

    .btn-danger {
      background: #f44336;
    }

    .btn-danger:hover {
      background: #d32f2f;
    }

    .toolbar {
      margin-bottom: 15px;
    }

    .log {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin-top: 15px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }

    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 CCB Pane 拖拽功能测试</h1>
      <p>测试 Config UI 的拖拽布局功能</p>
      <div class="status">
        ✅ 拖拽功能已启用 | <span id="operationCount">0</span> 次操作
      </div>
    </div>

    <div class="instructions">
      <h3>📝 测试说明</h3>
      <ul>
        <li><strong>拖拽</strong>：按住鼠标左键拖动任意 pane</li>
        <li><strong>放置位置</strong>：
          <ul>
            <li>顶部 35% 区域 → 在上方插入</li>
            <li>底部 35% 区域 → 在下方插入</li>
            <li>左侧 35% 区域 → 在左侧插入</li>
            <li>右侧 35% 区域 → 在右侧插入</li>
            <li>中心 30% 区域 → 替换目标</li>
          </ul>
        </li>
        <li><strong>视觉反馈</strong>：蓝色指示线显示放置位置</li>
        <li><strong>自动填充</strong>：原位置会被相邻 pane 填充</li>
      </ul>
    </div>

    <div class="layout-container">
      <div class="toolbar">
        <button class="btn" onclick="resetLayout()">🔄 重置布局</button>
        <button class="btn" onclick="addPane()">➕ 添加 Pane</button>
        <button class="btn btn-danger" onclick="clearLog()">🗑️ 清空日志</button>
      </div>

      <div id="layoutGrid" class="layout-grid"></div>

      <div class="log" id="log">
        <div class="log-entry">📋 操作日志：</div>
      </div>
    </div>
  </div>

  <script>
    // 简化的状态管理
    let panes = [
      { id: 1, name: 'Pane A', provider: 'codex' },
      { id: 2, name: 'Pane B', provider: 'claude' },
      { id: 3, name: 'Pane C', provider: 'gemini' },
      { id: 4, name: 'Pane D', provider: 'deepseek' }
    ];

    let dragState = {
      draggedId: null,
      targetId: null,
      position: null
    };

    let operationCount = 0;

    // 渲染布局
    function renderLayout() {
      const container = document.getElementById('layoutGrid');
      container.innerHTML = '';

      panes.forEach((pane, index) => {
        const paneEl = document.createElement('div');
        paneEl.className = 'pane relative';
        paneEl.draggable = true;
        paneEl.dataset.paneId = pane.id;
        paneEl.innerHTML = `
          <div class="pane-name">${pane.name}</div>
          <div class="pane-meta">Provider: ${pane.provider}</div>
          <div class="pane-meta">Index: ${index}</div>
        `;

        bindDragEvents(paneEl);
        container.appendChild(paneEl);
      });

      updateGridLayout();
    }

    // 更新网格布局
    function updateGridLayout() {
      const container = document.getElementById('layoutGrid');
      const count = panes.length;

      if (count <= 2) {
        container.style.gridTemplateColumns = '1fr 1fr';
      } else if (count === 3) {
        container.style.gridTemplateColumns = '1fr 1fr';
        container.children[2].style.gridColumn = '1 / -1';
      } else {
        container.style.gridTemplateColumns = '1fr 1fr';
      }
    }

    // 绑定拖拽事件
    function bindDragEvents(paneEl) {
      paneEl.addEventListener('dragstart', (e) => {
        dragState.draggedId = parseInt(paneEl.dataset.paneId);
        paneEl.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        logAction(`开始拖拽: ${paneEl.querySelector('.pane-name').textContent}`);
      });

      paneEl.addEventListener('dragend', (e) => {
        paneEl.classList.remove('dragging');
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('drag-over'));
        removeDropIndicators();
        dragState = { draggedId: null, targetId: null, position: null };
      });

      paneEl.addEventListener('dragenter', (e) => {
        if (dragState.draggedId && parseInt(paneEl.dataset.paneId) !== dragState.draggedId) {
          e.preventDefault();
          paneEl.classList.add('drag-over');
        }
      });

      paneEl.addEventListener('dragover', (e) => {
        const targetId = parseInt(paneEl.dataset.paneId);
        if (dragState.draggedId && targetId !== dragState.draggedId) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';

          const position = calculateDropPosition(paneEl, e);
          dragState.targetId = targetId;
          dragState.position = position;

          showDropIndicator(paneEl, position);
        }
      });

      paneEl.addEventListener('dragleave', (e) => {
        if (e.target === paneEl && !paneEl.contains(e.relatedTarget)) {
          paneEl.classList.remove('drag-over');
        }
      });

      paneEl.addEventListener('drop', (e) => {
        e.preventDefault();
        paneEl.classList.remove('drag-over');
        removeDropIndicators();

        if (dragState.draggedId && dragState.targetId && dragState.position) {
          performDrop();
        }
      });
    }

    // 计算放置位置
    function calculateDropPosition(element, event) {
      const rect = element.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const width = rect.width;
      const height = rect.height;
      const threshold = 0.35;

      if (y < height * threshold) return 'top';
      if (y > height * (1 - threshold)) return 'bottom';
      if (x < width * threshold) return 'left';
      if (x > width * (1 - threshold)) return 'right';
      return 'center';
    }

    // 显示放置指示器
    function showDropIndicator(element, position) {
      removeDropIndicators();
      if (position === 'center') return;

      const indicator = document.createElement('div');
      indicator.className = `drop-indicator ${
        position === 'top' || position === 'bottom' ? 'vertical' : 'horizontal'
      } ${position}`;

      element.appendChild(indicator);
    }

    // 移除放置指示器
    function removeDropIndicators() {
      document.querySelectorAll('.drop-indicator').forEach(el => el.remove());
    }

    // 执行拖放
    function performDrop() {
      const fromIndex = panes.findIndex(p => p.id === dragState.draggedId);
      const toIndex = panes.findIndex(p => p.id === dragState.targetId);

      if (fromIndex === -1 || toIndex === -1) return;

      const draggedPane = panes[fromIndex];
      const targetPane = panes[toIndex];
      const position = dragState.position;

      logAction(`拖放: ${draggedPane.name} → ${targetPane.name} (${position})`);

      // 简化版：交换位置
      if (position === 'center') {
        [panes[fromIndex], panes[toIndex]] = [panes[toIndex], panes[fromIndex]];
      } else {
        // 移动到目标位置
        panes.splice(fromIndex, 1);
        const newToIndex = panes.findIndex(p => p.id === dragState.targetId);

        if (position === 'top' || position === 'left') {
          panes.splice(newToIndex, 0, draggedPane);
        } else {
          panes.splice(newToIndex + 1, 0, draggedPane);
        }
      }

      operationCount++;
      document.getElementById('operationCount').textContent = operationCount;
      renderLayout();
    }

    // 重置布局
    function resetLayout() {
      panes = [
        { id: 1, name: 'Pane A', provider: 'codex' },
        { id: 2, name: 'Pane B', provider: 'claude' },
        { id: 3, name: 'Pane C', provider: 'gemini' },
        { id: 4, name: 'Pane D', provider: 'deepseek' }
      ];
      operationCount = 0;
      document.getElementById('operationCount').textContent = operationCount;
      logAction('🔄 布局已重置');
      renderLayout();
    }

    // 添加 Pane
    function addPane() {
      const newId = Math.max(...panes.map(p => p.id)) + 1;
      const providers = ['codex', 'claude', 'gemini', 'deepseek', 'opencode'];
      panes.push({
        id: newId,
        name: `Pane ${String.fromCharCode(64 + newId)}`,
        provider: providers[newId % providers.length]
      });
      logAction(`➕ 添加了 Pane ${String.fromCharCode(64 + newId)}`);
      renderLayout();
    }

    // 日志记录
    function logAction(message) {
      const log = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const time = new Date().toLocaleTimeString();
      entry.textContent = `[${time}] ${message}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    // 清空日志
    function clearLog() {
      document.getElementById('log').innerHTML = '<div class="log-entry">📋 操作日志：</div>';
    }

    // 初始化
    renderLayout();
    logAction('✅ 页面加载完成，可以开始测试拖拽功能');
  </script>
</body>
</html>
